services:
  - type: web
    name: careertrack
    env: node
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    disk:
      name: careertrack-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

